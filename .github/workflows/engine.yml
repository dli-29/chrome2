# Chrome 2 engine: a relocatable PyQt6 + Qt WebEngine bundle WITH proprietary codecs (H.264 / AAC / HEVC) for
# Apple Silicon Macs, made from Homebrew's bottles (its qtwebengine is built with
# -DFEATURE_webengine_proprietary_codecs=ON; pip's PyQt6-WebEngine is not), tested on a clean runner with
# Homebrew hidden and python.org's Python 3.14, then published as a GitHub release with a no-admin installer.
#
#   build           macos-15: brew install pyqt -> tools/engine/build_bundle.py (copy, relocate, strip, sign, verify)
#   test            fresh macos-15, Homebrew moved away: python.org Python 3.14 + tools/install-engine.sh into a
#                   fake home, then codec support, H.264+AAC playback over HTTP (plain + MSE), Chrome 2 itself,
#                   and DYLD_PRINT_LIBRARIES / lsof: nothing may come from /opt/homebrew
#   publish         only after test passed (contents: write only here): release engine-qt<version>-arm64
#   verify-release  fresh macos-15: the published one-line install command, end to end
name: Engine bundle

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/engine.yml"
      - "tools/**"

permissions:
  contents: read

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (macos-15, Homebrew bottles)
    runs-on: macos-15
    timeout-minutes: 90
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    outputs:
      tag: ${{ steps.bundle.outputs.tag }}
      version: ${{ steps.bundle.outputs.version }}
      min_macos: ${{ steps.bundle.outputs.min_macos }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Runner
        run: |
          sw_vers
          uname -m
          brew --version
          df -h / | tail -1

      - name: brew install pyqt qtimageformats ffmpeg (bottles)
        run: |
          brew update --quiet || brew update
          for attempt in 1 2; do
            if brew install --quiet pyqt qtimageformats ffmpeg; then break; fi
            echo "::warning::brew install attempt $attempt failed (exit $?); retrying / checking what is installed"
          done
          brew list --versions pyqt qtbase qtwebengine qtdeclarative qtsvg qtimageformats python@3.14 ffmpeg
          brew info --json=v2 --installed | /usr/bin/python3 -c '
          import json, sys
          for f in json.load(sys.stdin)["formulae"]:
              if f["name"] in ("pyqt", "qtbase", "qtwebengine", "qtdeclarative", "qtimageformats"):
                  i = f["installed"][0]
                  print(f["name"], i["version"], "poured_from_bottle =", i["poured_from_bottle"])
          '
          grep -rl "webengine_proprietary_codecs" "$(brew --prefix qtwebengine)/lib/cmake" 2>/dev/null | head -3 || true

      - name: Make H.264 + AAC test media (ffmpeg, libx264)
        run: |
          mkdir -p media
          ff() { ffmpeg -hide_banner -loglevel error -y "$@"; }
          ff -f lavfi -i "testsrc2=size=640x360:rate=30:duration=10" -f lavfi -i "sine=frequency=440:sample_rate=44100:duration=10" \
             -c:v libx264 -profile:v main -level 3.1 -pix_fmt yuv420p -g 30 -c:a aac -b:a 96k -ac 2 -shortest \
             -movflags +faststart media/test-h264-aac.mp4
          ff -i media/test-h264-aac.mp4 -c copy -movflags +frag_keyframe+empty_moov+default_base_moof media/test-h264-aac-frag.mp4
          ff -f lavfi -i "testsrc2=size=160x120:rate=25:duration=3" -f lavfi -i "sine=frequency=660:sample_rate=44100:duration=3" \
             -c:v libx264 -profile:v baseline -pix_fmt yuv420p -g 25 -c:a aac -b:a 48k -ac 1 -shortest \
             -movflags +faststart media/selftest-h264-aac.mp4
          for f in media/*.mp4; do
            echo "$f ($(stat -f %z "$f") bytes): $(ffprobe -v error -show_entries stream=codec_name,profile,width,height,sample_rate -of compact=p=0 "$f" | tr '\n' ' ')"
          done

      - name: Assemble, relocate, sign and verify the bundle
        id: bundle
        run: |
          PY="$(brew --prefix python@3.14)/bin/python3.14"
          "$PY" tools/engine/build_bundle.py --work build --out dist --selftest-media media/selftest-h264-aac.mp4 \
            --build-number "$GITHUB_RUN_NUMBER" --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
          ls -la dist

      - name: Manifest
        run: cat dist/chrome2-engine-manifest.json

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: engine
          path: dist/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: test-media
          path: media/
          retention-days: 7
          if-no-files-found: error

  test:
    name: Test (clean macos-15, Homebrew hidden, python.org Python 3.14)
    needs: build
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
    env:
      FAKE_HOME: /Users/runner/Fake Home
      PYORG: /Library/Frameworks/Python.framework/Versions/3.14/bin/python3.14
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8.0.2
        with:
          name: engine
          path: dist

      - uses: actions/download-artifact@v8.0.2
        with:
          name: test-media
          path: media

      - name: Install python.org Python 3.14 (official installer, like the user's)
        run: /bin/bash tools/engine/ci_python_org.sh

      - name: Fake home with foxglove.py where the user keeps it
        run: |
          mkdir -p "$FAKE_HOME/Desktop/temp" "$RUNNER_TEMP/logs"
          cp foxglove.py "$FAKE_HOME/Desktop/temp/foxglove.py"
          (cd dist && shasum -a 256 -c chrome2-engine-arm64.tar.gz.sha256)

      - name: Hide Homebrew
        run: /bin/bash tools/engine/ci_homebrew.sh hide

      - name: Install the engine as the user would (into the fake home)
        run: |
          export HOME="$FAKE_HOME"
          export CHROME2_ENGINE_BASE_URL="file://$GITHUB_WORKSPACE/dist"
          /bin/bash -c "$(cat dist/install-engine.sh)" 2>&1 | tee "$RUNNER_TEMP/logs/install-1.log"
          grep -q "H.264: supported" "$RUNNER_TEMP/logs/install-1.log"
          grep -q "AAC: supported" "$RUNNER_TEMP/logs/install-1.log"
          echo "==== running it again (upgrade / repair path)"
          /bin/bash dist/install-engine.sh 2>&1 | tee "$RUNNER_TEMP/logs/install-2.log"
          grep -q "Already installed" "$RUNNER_TEMP/logs/install-2.log"
          grep -q "H.264: supported" "$RUNNER_TEMP/logs/install-2.log"
          du -sh "$HOME/Library/Application Support/Chrome2 Engine"/* "$HOME/chrome2-env"

      - name: (a) PyQt6 and Qt load from the engine
        run: |
          export HOME="$FAKE_HOME" CFFIXED_USER_HOME="$FAKE_HOME"
          "$HOME/chrome2-env/bin/python3" - <<'PY'
          import os, sys
          import PyQt6
          from PyQt6 import sip, QtCore, QtGui, QtWidgets, QtNetwork, QtPrintSupport, QtSvg, QtWebEngineCore, QtWebEngineWidgets
          engine = os.path.realpath(os.environ["CHROME2_ENGINE"])
          print("sys.executable", sys.executable, sys.version.split()[0])
          print("engine", engine)
          bad = 0
          for module in (PyQt6, sip, QtCore, QtGui, QtWidgets, QtNetwork, QtPrintSupport, QtSvg, QtWebEngineCore, QtWebEngineWidgets):
              path = os.path.realpath(module.__file__)
              ok = path.startswith(engine + "/")
              bad += not ok
              print("OK  " if ok else "BAD ", module.__name__, path)
          print("Qt", QtCore.QT_VERSION_STR, "PyQt6", QtCore.PYQT_VERSION_STR, "Chromium", QtWebEngineCore.qWebEngineChromiumVersion())
          print("QT_PLUGIN_PATH", os.environ.get("QT_PLUGIN_PATH"))
          print("QTWEBENGINEPROCESS_PATH", os.environ.get("QTWEBENGINEPROCESS_PATH"))
          sys.exit(1 if bad else 0)
          PY

      - name: (b)+(d) H.264/AAC support, playback over HTTP, DYLD_PRINT_LIBRARIES
        run: |
          export HOME="$FAKE_HOME" CFFIXED_USER_HOME="$FAKE_HOME"
          VPY="$HOME/chrome2-env/bin/python3"
          engine="$("$VPY" -c 'import os; print(os.environ["CHROME2_ENGINE"])')"
          passed=""
          for platform in cocoa offscreen; do
            echo "==== platform $platform (DYLD_PRINT_LIBRARIES=1)"
            status=0
            DYLD_PRINT_LIBRARIES=1 "$VPY" tools/engine/engine_check_playback.py media --platform "$platform" \
              --report "$RUNNER_TEMP/logs/playback-$platform.json" \
              > "$RUNNER_TEMP/logs/playback-$platform.out" 2> "$RUNNER_TEMP/logs/playback-$platform.stderr" || status=$?
            cat "$RUNNER_TEMP/logs/playback-$platform.out"
            echo "---- non-dyld stderr (first 40 lines)"
            grep -v '^dyld\[' "$RUNNER_TEMP/logs/playback-$platform.stderr" | head -40 || true
            "$PYORG" tools/engine/ci_dyld_report.py "$engine" "$RUNNER_TEMP/logs/playback-$platform.stderr"
            echo "==== platform $platform: exit status $status"
            if [ "$status" = 0 ]; then passed="$passed $platform"; else echo "::warning::playback check failed with QT_QPA_PLATFORM=$platform"; fi
          done
          [ -n "$passed" ] || { echo "::error::the playback check failed on every platform"; exit 1; }
          echo "Playback check passed on:$passed"

      - name: (c) Chrome 2 (foxglove.py) runs on the engine
        run: |
          check() {
            "$PYORG" tools/engine/engine_check_foxglove.py --python "$FAKE_HOME/chrome2-env/bin/python3" \
              --script "$FAKE_HOME/Desktop/temp/foxglove.py" --home "$FAKE_HOME" --seconds 20 \
              --platform "$1" --log "$RUNNER_TEMP/logs/chrome2-$1.log"
          }
          if check cocoa; then
            echo "Chrome 2 ran with the cocoa platform (a real window)"
          else
            echo "::warning::Chrome 2 check failed with the cocoa platform; trying offscreen"
            check offscreen
          fi

      - name: Restore Homebrew
        if: always()
        run: /bin/bash tools/engine/ci_homebrew.sh restore

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: test-logs
          path: ${{ runner.temp }}/logs/
          retention-days: 14

  publish:
    name: Publish the release
    needs: [build, test]
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      tag: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: engine
          path: dist

      - name: Create or update the release (assets overwritten on re-runs)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c chrome2-engine-arm64.tar.gz.sha256
          python3 - "$TAG" "$GITHUB_REPOSITORY" > notes.md <<'PY'
          import json, sys
          tag, repo = sys.argv[1], sys.argv[2]
          m = json.load(open("chrome2-engine-manifest.json"))
          url = f"https://github.com/{repo}/releases/download/{tag}/install-engine.sh"
          print(f"""Chrome 2's engine with **H.264 / AAC** (proprietary codecs): PyQt6 {m['pyqt_version']} + Qt WebEngine {m['qt_version']} (Chromium {m['chromium_version']}), built from Homebrew's bottles and made self-contained.

          **Needs:** an Apple Silicon Mac, macOS {m['min_macos']} or newer, and python.org's Python 3.14. No admin password.

          **Install** (Terminal):

          ```
          /bin/bash -c "$(curl -fsSL {url})"
          ```

          Then start Chrome 2 with `~/chrome2-env/bin/python3 ~/Desktop/temp/foxglove.py`. Your data in `~/Library/Application Support/Foxglove` and your old `~/foxglove-env` are untouched.

          | | |
          |---|---|
          | Engine version | {m['version']} |
          | Tarball | {m['tarball_bytes'] / 1e6:.0f} MB, SHA-256 `{m['tarball_sha256']}` |
          | Unpacked | {m['size_bytes'] / 1e6:.0f} MB, {m['file_count']} files ({m['macho_count']} Mach-O) |
          | Minimum macOS (largest LC_BUILD_VERSION minos) | {m['min_macos']} |
          | Built on | macOS {m['build']['runner_macos']}, commit {m['build']['commit'][:12]}, run #{m['build']['build_number']} |
          | Homebrew | qtbase {m['homebrew_versions'].get('qtbase')}, qtwebengine {m['homebrew_versions'].get('qtwebengine')}, pyqt {m['homebrew_versions'].get('pyqt')} |
          """.replace("\n          ", "\n"))
          PY
          files="chrome2-engine-arm64.tar.gz chrome2-engine-arm64.tar.gz.sha256 chrome2-engine-manifest.json install-engine.sh"
          title="Chrome 2 engine: Qt WebEngine $(python3 -c 'import json; print(json.load(open("chrome2-engine-manifest.json"))["qt_version"])') with H.264/AAC (Apple Silicon)"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # shellcheck disable=SC2086
            gh release upload "$TAG" $files --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --title "$title" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          else
            # shellcheck disable=SC2086
            gh release create "$TAG" $files --title "$title" --notes-file notes.md --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets \
            --jq '.url, (.assets[] | "\(.name)  \(.size)  \(.url)")'

  verify-release:
    name: Install from the published release (fresh macos-15)
    needs: [build, publish]
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
    env:
      FAKE_HOME: /Users/runner/Another Home
      TAG: ${{ needs.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install python.org Python 3.14
        run: /bin/bash tools/engine/ci_python_org.sh

      - name: Hide Homebrew
        run: /bin/bash tools/engine/ci_homebrew.sh hide

      - name: The published one-line install command
        run: |
          mkdir -p "$FAKE_HOME"
          export HOME="$FAKE_HOME"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/install-engine.sh"
          echo "+ /bin/bash -c \"\$(curl -fsSL $url)\""
          /bin/bash -c "$(curl -fsSL "$url")" 2>&1 | tee "$RUNNER_TEMP/install.log"
          grep -q "H.264: supported" "$RUNNER_TEMP/install.log"
          grep -q "Playback: OK" "$RUNNER_TEMP/install.log" || echo "::warning::self-test playback didn't report OK"

      - name: Restore Homebrew
        if: always()
        run: /bin/bash tools/engine/ci_homebrew.sh restore
